trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Backend
    displayName: 'Build & Test Backend (.NET)'
    jobs:
      - job: BuildBackend
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - script: dotnet restore
            displayName: 'Restaurar dependencias'
            workingDirectory: backend

          - script: dotnet build --no-restore --configuration Release
            displayName: 'Compilar solución'
            workingDirectory: backend

          - script: dotnet test --no-build --configuration Release --logger trx
            displayName: 'Ejecutar pruebas unitarias'
            workingDirectory: backend
            continueOnError: true

          - task: PublishTestResults@2
            displayName: 'Publicar resultados de pruebas'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'VSTest'
              testResultsFiles: '**/*.trx'
              searchFolder: 'backend'

  - stage: Frontend
    displayName: 'Build Frontend (React + Vite)'
    dependsOn: Backend
    jobs:
      - job: BuildFrontend
        steps:
          - task: NodeTool@0
            displayName: 'Instalar Node.js'
            inputs:
              versionSpec: '18.x'

          - script: npm install
            displayName: 'Instalar dependencias'
            workingDirectory: frontend

          - script: npm run build
            displayName: 'Compilar frontend'
            workingDirectory: frontend